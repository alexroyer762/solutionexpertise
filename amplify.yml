version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify n'expose pas les variables d'env au runtime SSR : on les écrit dans .env.production pour que Next.js les embarque
        - env | grep -e RUNWAYML_API_SECRET >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
